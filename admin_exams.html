{% extends 'base.html' %}{% block content %}<section class="page-title"><span class="eyebrow dark">ADMIN</span><h1>Exam Schedule</h1></section><form class="form-card" method="post"><div class="form-grid"><label>Exam title *<input name="title" required></label><label>Class<select name="class_name">{% for c in range(1,13) %}<option>{{ c }}</option>{% endfor %}<option>+2 1st Year</option><option>+2 2nd Year</option></select></label><label>Date<input type="date" name="exam_date"></label><label>Total marks<input type="number" name="total_marks" value="100" min="1"></label><label class="span-2">Instructions / details<textarea name="details"></textarea></label></div><button class="btn gold">Add Exam</button></form><section class="cards">{% for e in exams %}<article class="card"><span class="pill">Class {{ e.class_name }}</span><h3>{{ e.title }}</h3><p>{{ e.exam_date }} · {{ e.total_marks }} marks</p><p>{{ e.details }}</p></article>{% endfor %}</section>{% endblock %}
