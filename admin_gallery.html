{% extends 'base.html' %}{% block content %}<section class="page-title"><span class="eyebrow dark">ADMIN</span><h1>Gallery Manager</h1></section><form class="form-card" method="post" enctype="multipart/form-data"><div class="form-grid"><label>Photo title<input name="title" required></label><label>Caption<input name="caption"></label><label class="span-2">Image *<input type="file" name="image" accept="image/png,image/jpeg,image/webp" required></label></div><button class="btn gold">Add Photo</button></form><section class="gallery-grid">{% for g in gallery %}<figure><img src="{{ url_for('static',filename='uploads/'+g.image_path) }}" alt="{{ g.title }}"><figcaption>{{ g.title }}<br>{{ g.caption }}</figcaption></figure>{% endfor %}</section>{% endblock %}
