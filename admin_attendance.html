{% extends 'base.html' %}{% block content %}<section class="page-title"><span class="eyebrow dark">ADMIN</span><h1>Class Attendance</h1></section><form class="filter-row" method="get"><label>Class<select name="class_name">{% for c in range(1,13) %}<option {% if selected_class==c|string %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Date<input type="date" name="class_date" value="{{ class_date }}"></label><button class="btn navy">Load Students</button></form><form method="post" class="form-card"><input type="hidden" name="class_name" value="{{ selected_class }}"><input type="hidden" name="class_date" value="{{ class_date }}"><div class="table-wrap"><table><tr><th>Student</th><th>ID</th><th>Status</th></tr>{% for s in students %}<tr><td>{{ s.name }}</td><td>{{ s.student_code }}</td><td><select name="student_{{ s.id }}"><option {% if s.status=='Present' %}selected{% endif %}>Present</option><option {% if s.status=='Absent' %}selected{% endif %}>Absent</option><option {% if s.status=='Late' %}selected{% endif %}>Late</option></select></td></tr>{% else %}<tr><td colspan="3">No students in this class.</td></tr>{% endfor %}</table></div><button class="btn gold">Save Attendance</button></form>{% endblock %}
